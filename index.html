<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="robots" content="noindex,nofollow">
<title>Jay 가계부</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#F9FAFB; --ink:#191F28; --ink2:#4E5968; --sub:#8B95A1; --faint:#D1D6DB; --line:#E5E8EB;
  --blue:#3182F6; --blue-soft:#E8F3FF; --red:#F04452; --red-soft:#FFEEEE; --green:#00A661;
  --shadow:0 2px 12px rgba(0,27,55,.06);
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101013; --surface:#1C1C21; --surface2:#26262C; --ink:#F2F4F6; --ink2:#C4CAD1; --sub:#8B95A1; --faint:#3A3A42; --line:#2C2C33;
    --blue:#4B93FF; --blue-soft:#1A2A44; --red:#FF5C67; --red-soft:#3A1C20; --green:#2FD08A; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101013; --surface:#1C1C21; --surface2:#26262C; --ink:#F2F4F6; --ink2:#C4CAD1; --sub:#8B95A1; --faint:#3A3A42; --line:#2C2C33;
  --blue:#4B93FF; --blue-soft:#1A2A44; --red:#FF5C67; --red-soft:#3A1C20; --green:#2FD08A; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 0 calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px)}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 20px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.month{display:flex;align-items:center;gap:2px;font-size:22px;font-weight:700}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.month button:active{background:var(--line)}
.month span{min-width:76px;text-align:center}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sync{font-size:12px;color:var(--sub);margin-top:2px;min-height:18px}
.sync.warn{color:var(--red)}

main{padding:4px 16px 0}
.card{background:var(--surface);border-radius:var(--r-lg);padding:22px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:17px;font-weight:700;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.card h2 .more{font-size:14px;font-weight:500;color:var(--sub)}

/* 히어로 */
.hero-label{font-size:15px;color:var(--ink2);font-weight:500}
.hero-amt{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px;line-height:1.2}
.hero-amt small{font-size:24px;font-weight:700}
.hero-note{font-size:14px;color:var(--sub)}
.hero-note b{color:var(--ink);font-weight:600}
.hero-note .over{color:var(--red)}
.pace{position:relative;height:10px;border-radius:5px;background:var(--line);margin:20px 0 8px;overflow:visible}
.pace-fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--blue);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pace-fill.over{background:var(--red)}
.pace-today{position:absolute;top:-5px;width:2px;height:20px;background:var(--ink);border-radius:1px}
.pace-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.hero-split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.mini{background:var(--surface2);border-radius:var(--r-md);padding:12px 14px}
.mini span{display:block;font-size:13px;color:var(--sub)}
.mini b{font-size:17px;font-weight:700}
.plus{color:var(--blue)}

/* 빠른 입력 */
.quick{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-md);padding:6px 6px 6px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.quick input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0;padding:8px 0}
.quick input::placeholder{color:var(--sub)}
.quick button{height:40px;padding:0 14px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:14px;white-space:nowrap}
.quick-preview{font-size:13px;color:var(--sub);margin:-6px 4px 12px;min-height:0}

/* 리스트 */
.row{display:flex;align-items:center;gap:14px;padding:10px 0;width:100%;text-align:left}
.row:active{opacity:.6}
.ico{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px}
.row-main{flex:1;min-width:0}
.row-title{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:block;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{font-weight:700;font-size:16px;text-align:right;white-space:nowrap}
.row-amt.in{color:var(--blue)}
.row-amt.tr{color:var(--sub)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--blue-soft);color:var(--blue);margin-left:6px;vertical-align:2px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--sub);margin:18px 4px 2px}
.day-head b{color:var(--ink2);font-weight:600}
.day-card{background:var(--surface);border-radius:var(--r-lg);padding:6px 20px;box-shadow:var(--shadow)}

/* 카테고리 막대 */
.catbar{display:flex;align-items:center;gap:14px;padding:9px 0;width:100%;text-align:left}
.catbar .row-main{display:flex;flex-direction:column;gap:6px}
.catbar .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.catbar .track i{display:block;height:100%;border-radius:3px}
.catbar .top-line{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.catbar .top-line em{font-style:normal;color:var(--sub);font-weight:500;font-size:13px;margin-left:4px}
.budget-flag{font-size:12px;font-weight:600;color:var(--red)}

/* 필터·검색 */
.toolbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--surface);font-size:14px;font-weight:600;color:var(--ink2);box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-md);padding:0 14px;height:48px;margin-bottom:10px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;background:none;font-size:16px}
.list-sum{display:flex;gap:16px;font-size:14px;color:var(--sub);margin:4px 4px 0}
.list-sum b{color:var(--ink);font-weight:700}

/* 통계 */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:24px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bar-pair i{display:block;width:12px;border-radius:4px 4px 2px 2px;min-height:2px;transition:height .5s}
.bar-col span{font-size:12px;color:var(--sub)}
.bar-col.now span{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-top:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{flex:none}
.donut-center{font-size:13px;fill:var(--sub)}
.donut-center-b{font-size:16px;font-weight:700;fill:var(--ink)}
.pl{width:100%;border-collapse:collapse;font-size:14px}
.pl th{font-weight:500;color:var(--sub);text-align:right;padding:6px 0;font-size:13px}
.pl th:first-child,.pl td:first-child{text-align:left}
.pl td{padding:9px 0;text-align:right;border-top:1px solid var(--line);font-weight:600}
.pl td.neg{color:var(--red)} .pl td.pos{color:var(--blue)}
.insight{font-size:15px;line-height:1.6;color:var(--ink2);margin:0}
.insight b{color:var(--ink)}

/* 설정 */
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:500}
.input{width:100%;height:50px;border-radius:var(--r-sm);border:0;background:var(--surface2);padding:0 14px;font-size:16px;outline:none}
.input:focus{box-shadow:inset 0 0 0 2px var(--blue)}
textarea.input{height:120px;padding:12px 14px;resize:vertical;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:var(--r-md);background:var(--blue);color:#fff;font-weight:700;font-size:17px}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.4}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn-row{display:flex;gap:8px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;width:100%;text-align:left;font-size:16px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row span{color:var(--sub);font-size:15px}
.help{font-size:14px;color:var(--sub);line-height:1.6;margin:0 0 14px}
.help code{background:var(--surface2);padding:1px 6px;border-radius:6px;font-size:13px;color:var(--ink2)}
.steps{margin:0;padding-left:20px;font-size:14px;color:var(--ink2);line-height:1.7}

/* 연결 화면 */
.onboard{padding:calc(env(safe-area-inset-top) + 56px) 24px 40px;max-width:480px;margin:0 auto}
.onboard h1{font-size:28px;font-weight:800;line-height:1.35;margin:0 0 10px;letter-spacing:-.03em}
.onboard p{color:var(--ink2);margin:0 0 32px}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--sub)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab-add{justify-self:center;width:52px;height:52px;border-radius:18px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(49,130,246,.35)}
.tab-add:active{transform:scale(.94)}
.tab-add svg{width:26px;height:26px}

/* 바텀시트 */
.dim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:480px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;max-height:94dvh;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-grip{width:36px;height:5px;border-radius:3px;background:var(--faint);margin:10px auto 0;flex:none}
.sheet-body{overflow-y:auto;padding:14px 20px 12px;flex:1}
.sheet-foot{padding:10px 20px calc(env(safe-area-inset-bottom) + 14px);flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-head h3{margin:0;font-size:20px;font-weight:700}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.amt-display{font-size:38px;font-weight:800;letter-spacing:-.03em;padding:10px 0 2px;min-height:62px;display:flex;align-items:baseline;gap:4px;cursor:text}
.amt-display.empty{color:var(--faint)}
.amt-display .caret{width:2px;height:34px;background:var(--blue);align-self:center;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.amt-hint{font-size:13px;color:var(--sub);min-height:20px}
.quick-amts{display:flex;gap:6px;margin:10px 0 4px}
.quick-amts button{flex:1;height:34px;border-radius:10px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--ink2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:6px -4px 0}
.pad button{height:48px;border-radius:12px;font-size:24px;font-weight:600}
.pad button:active{background:var(--surface2)}
.label{font-size:13px;color:var(--sub);font-weight:600;margin:18px 0 8px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;font-size:12px;font-weight:600;color:var(--ink2);line-height:1.25;text-align:center;word-break:keep-all}
.cat-btn .e{font-size:24px;line-height:1}
.cat-btn[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{box-shadow:none;background:var(--surface2)}
.chips .chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.date-in{position:relative}
.date-in input{position:absolute;inset:0;opacity:0}
.sheet .seg{width:100%;display:flex}
.sheet .seg button{flex:1;padding:9px 0;font-size:15px}
.step-hidden{display:none}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(25,31,40,.94);color:#fff;border-radius:14px;padding:12px 8px 12px 18px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;width:max-content;max-width:calc(100% - 32px);transition:.22s}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#7DB4FF;font-weight:700;padding:4px 10px;white-space:nowrap;flex:none}

.empty-state{text-align:center;padding:36px 12px;color:var(--sub);font-size:15px}
.empty-state .big{font-size:40px;margin-bottom:8px}
.import-preview{max-height:300px;overflow:auto;margin:0 -4px 14px;padding:0 4px}
.demo-badge{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:3px 8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.upload-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:12px;background:var(--blue);color:#fff;font-size:14px;font-weight:700}
.upload-btn:active{filter:brightness(.92)}
.book-seg{display:flex;margin-top:10px}
.book-seg button{flex:1;padding:8px 0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.trio div{background:var(--surface2);border-radius:var(--r-md);padding:12px}
.trio span{display:block;font-size:13px;color:var(--sub)}
.trio b{font-size:16px;font-weight:700}
.muted{color:var(--sub)}
.over-t{color:var(--red);font-weight:600}
.hint{font-size:12px;color:var(--sub);margin:10px 0 0}
.edit-sum{background:var(--surface2);border-radius:var(--r-md);padding:14px 16px;margin-top:6px}
.edit-title{font-weight:700;font-size:17px}
.imp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.imp-grid div{background:var(--surface2);border-radius:var(--r-md);padding:12px 14px}
.imp-grid span{display:block;font-size:13px;color:var(--sub)}
.imp-grid b{font-size:18px;font-weight:700}
.imp-grid em{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.sub-tbl{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.sub-tbl th:nth-child(2),.sub-tbl td:nth-child(2){width:62px}.sub-tbl th:nth-child(3),.sub-tbl td:nth-child(3){width:86px}
.sub-tbl td:first-child small,.sub-tbl td:first-child b{white-space:normal;word-break:keep-all}
.sub-tbl th{font-size:12px;font-weight:500;color:var(--sub);text-align:left;padding:0 4px 8px;white-space:nowrap}
.sub-tbl td{padding:11px 4px;border-top:1px solid var(--line);vertical-align:middle}
.sub-tbl .c{text-align:center}.sub-tbl .r{text-align:right;white-space:nowrap}
.sub-tbl small{display:block;font-size:11px;color:var(--sub);font-weight:400;white-space:nowrap}
.sub-tbl tr.off td{color:var(--sub)}
.sub-name{display:flex;align-items:center;gap:10px;min-width:0}
.sub-name>span{flex:none;width:34px;height:34px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-size:17px}
.sub-name b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.pill{font-style:normal;vertical-align:1px;display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--surface2);color:var(--ink2)}
.pill.biz{background:#EFE7FF;color:#7C3AED}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:18px 0 10px;gap:2px;background:var(--line)}
.stack i{display:block;height:100%}
.stack-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2)}
.stack-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head>div{text-align:center}.cal-head b{display:block;font-size:17px}.cal-head span{font-size:13px;color:var(--sub)}
.cal-head button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-week span{font-size:12px;color:var(--sub);padding-bottom:4px}
.cal-cell{height:66px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:2px;font-size:14px;color:var(--ink2);background:none}
.cal-cell.empty{visibility:hidden}
.cal-cell[disabled]{cursor:default;opacity:.55}
.cal-cell.has{background:var(--blue-soft);color:var(--ink);font-weight:600}
.cal-cell.has .cal-amt{font-size:10.5px;color:var(--blue);font-weight:700;letter-spacing:-.03em}
.cal-cell.past.has{background:var(--surface2)}.cal-cell.past.has .cal-amt{color:var(--sub)}
.cal-cell.today .cal-d{background:var(--ink);color:var(--surface);border-radius:8px;padding:0 6px}
.cal-cell.sel{outline:2px solid var(--blue);outline-offset:-2px}
.cal-day{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.cal-day-h{font-size:14px;font-weight:700;margin-bottom:2px}
.reg-item{display:flex;align-items:center;gap:14px;padding:9px 0}
.up-row{display:flex;align-items:center;gap:10px}
.up-row .reg-item{flex:1;min-width:0}
.dday{flex:none;width:42px;text-align:center;font-size:12px;font-weight:700;color:var(--sub);background:var(--surface2);border-radius:8px;padding:4px 0}
.dday.soon{color:var(--blue);background:var(--blue-soft)}
.grp summary{display:flex;align-items:center;gap:14px;padding:10px 0;cursor:pointer;list-style:none}
.grp summary::-webkit-details-marker{display:none}
.grp summary .row-amt{font-weight:700}
.grp[open] summary{border-bottom:1px solid var(--line);margin-bottom:4px}
.grp+.grp{border-top:1px solid var(--line)}
.grp .reg-item{padding-left:8px}
.ico-logo{box-shadow:inset 0 0 0 1px var(--line)}
.fav{width:24px;height:24px;border-radius:6px;display:block}
.cal-logos{display:flex;justify-content:center;margin:1px 0}
.cal-logo{width:17px;height:17px;border-radius:5px;background:var(--surface);box-shadow:0 0 0 1.5px var(--blue-soft);display:grid;place-items:center;font-size:10px;overflow:hidden}
.cal-logo+.cal-logo{margin-left:-5px}
.cal-cell.past .cal-logo{box-shadow:0 0 0 1.5px var(--surface2);opacity:.6}
.fav-s{width:13px;height:13px;display:block}
.cal-more{font-size:9px;color:var(--sub);margin-left:2px;align-self:center}
.hero2 .hero-amt{font-size:36px}
.hero-note b.up{color:var(--red)}.hero-note b.down{color:var(--blue)}
.insight b.up{color:var(--red)}.insight b.down{color:var(--blue)}
.budget-line{margin:16px 0 6px}.budget-line .pace{margin:0 0 8px}
.pace-legend b{font-weight:700;color:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;margin-top:12px;border-top:1px solid var(--line);font-size:15px}
.kv+.kv{margin-top:0;border-top:0;padding-top:8px}
.kv span{color:var(--ink2)}.kv b{font-weight:700}
.kv em{font-style:normal;font-size:11px;color:var(--sub);background:var(--surface2);border-radius:6px;padding:1px 6px;margin-left:4px}
.muted-row b{color:var(--sub)}
.card.tap{cursor:pointer}
.up-chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.up-chips::-webkit-scrollbar{display:none}
.up-chip{flex:none;width:104px;background:var(--surface2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:3px}
.up-chip b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-chip span.num{font-size:12px;color:var(--blue);font-weight:700}
.up-chip em{font-style:normal;font-size:14px;font-weight:700}
.up-logo{width:30px;height:30px;border-radius:9px;background:var(--surface);display:grid;place-items:center;font-size:16px;margin-bottom:4px;overflow:hidden}
.up-logo .fav{width:20px;height:20px}
.cat-row{display:flex;align-items:center;gap:14px;padding:9px 0;width:100%;text-align:left}
.cat-row:active{opacity:.6}
.more-btn{width:100%;margin-top:6px;height:42px;border-radius:12px;background:var(--surface2);font-size:14px;font-weight:600;color:var(--ink2)}
.mini-seg{display:inline-flex;background:var(--line);border-radius:9px;padding:2px}
.mini-seg button{font-size:12px;font-weight:600;color:var(--sub);padding:4px 10px;border-radius:7px}
.mini-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.tabs2{display:flex;gap:6px;margin:18px 0 6px}
.tabs2 button{flex:1;height:36px;border-radius:10px;background:var(--surface2);font-size:14px;font-weight:600;color:var(--sub)}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.bars2{position:relative;display:flex;align-items:flex-end;gap:10px;padding-top:4px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bwrap{height:136px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.blab{height:20px;line-height:20px}
.bcol i{display:block;width:70%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--faint)}
.bcol.now i{background:var(--blue)}
.bval{font-size:11px;color:var(--sub);font-weight:600}.bcol.now .bval{color:var(--blue);font-weight:800}
.blab{font-size:12px;color:var(--sub)}.bcol.now .blab{color:var(--ink);font-weight:700}
.avgline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--faint);pointer-events:none}
.avgline span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--sub);background:var(--surface);padding:0 4px}
.brief{margin:16px 0 4px;background:var(--surface2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.brief-row{display:flex;gap:10px;align-items:flex-start}
.brief-row span{flex:none;font-size:16px;line-height:1.45}
.brief-row p{margin:0;font-size:14px;line-height:1.5;color:var(--ink2);word-break:keep-all}
.brief-row b{color:var(--ink);font-weight:700}.brief-row b.up{color:var(--red)}.brief-row b.down{color:var(--blue)}
</style>
</head>
<body>
<div id="root"></div>
<div class="dim" id="dim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="내역 입력"><div class="sheet-grip"></div><div class="sheet-body" id="sheetBody"></div><div class="sheet-foot" id="sheetFoot"></div></section>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" hidden>실행 취소</button></div>
<input type="file" id="fileIn" accept=".csv,.xlsx,.xls,text/csv" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="app.js?v=13"></script>
</body>
</html>
